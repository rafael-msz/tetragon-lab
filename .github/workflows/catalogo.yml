name: Validar catálogo de políticas

# A cada push/PR que mexe em políticas, confere se a tabela em policies/README.md
# está em dia com os YAMLs. NÃO altera o repositório: se estiver desatualizada, a
# verificação FALHA pedindo para você rodar o script e commitar.

on:
  push:
    paths:
      - 'policies/**/*.yaml'
      - 'policies/**/*.yml'
      - 'scripts/gerar-catalogo.sh'
  pull_request:
    paths:
      - 'policies/**/*.yaml'
      - 'policies/**/*.yml'
      - 'scripts/gerar-catalogo.sh'

jobs:
  validar-catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerar o catálogo
        run: bash scripts/gerar-catalogo.sh
      - name: Conferir se está em dia
        run: |
          if ! git diff --quiet -- policies/README.md; then
            echo "::error::O catálogo (policies/README.md) está desatualizado."
            echo "Rode 'bash scripts/gerar-catalogo.sh' e commite o resultado."
            git --no-pager diff -- policies/README.md
            exit 1
          fi
          echo "Catálogo em dia."
