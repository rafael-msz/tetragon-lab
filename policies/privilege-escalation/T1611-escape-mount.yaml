apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "escape-mount"
spec:
  kprobes:
  - call: "sys_mount"
    syscall: true
    args:
    - index: 0
      type: "string"      # fonte
    - index: 1
      type: "string"      # destino
    selectors:
    - matchNamespaceChanges:
      - operator: In
        values: ["Mnt"]
      matchActions:
      - action: Post
