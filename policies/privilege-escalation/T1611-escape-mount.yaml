apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "escape-mount"
  annotations:
    mitre.technique: "T1611"
    description: "Montagem a partir de dentro de um contêiner (mount do disco do host)"
    modo-suportado: "observação/contenção"
spec:
  # Carrega em modo 'monitor'. Para conter na hora:
  #   sudo bash scripts/05-modo.sh escape-mount enforce
  options:
    - name: "policy-mode"
      value: "monitor"
  kprobes:
  # Hook LSM (não é syscall): o Override usa fmod_ret e não depende de
  # bpf_override_return / CONFIG_BPF_KPROBE_OVERRIDE, que o kernel do WSL não tem.
  - call: "security_sb_mount"
    syscall: false
    args:
    - index: 0
      type: "string"      # origem (dev_name)
    - index: 1
      type: "path"        # ponto de montagem (struct path *)
    - index: 2
      type: "string"      # tipo do filesystem
    selectors:
    # matchNamespaceChanges detecta MUDANÇA de namespace (unshare/setns), não um mount
    # comum — por isso não disparava. O correto é filtrar pelo ESTADO: processo cujo
    # namespace de montagem NÃO é o do host = processo dentro de um contêiner.
    - matchNamespaces:
      - namespace: Mnt
        operator: NotIn
        values:
        - "host_ns"
      matchActions:
      # Em enforcement, Override faz o mount falhar.
      - action: Override
        argError: -1
