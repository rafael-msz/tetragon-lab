apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "escape-docker-sock"
spec:
  kprobes:
  - call: "security_file_open"
    syscall: false
    args:
    - index: 0
      type: "file"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "/run/docker.sock"
      matchActions:
      - action: Post
