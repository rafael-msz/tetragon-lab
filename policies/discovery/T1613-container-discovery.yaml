apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "container-discovery"
spec:
  kprobes:
  - call: "security_file_open"
    syscall: false
    args:
    - index: 0
      type: "file"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "/.dockerenv"
    - matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "/cgroup"
