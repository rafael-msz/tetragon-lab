apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "exec-ferramentas-transferencia"
spec:
  kprobes:
  # Hook na syscall de execução: dispara toda vez que um binário é executado.
  - call: "sys_execve"
    syscall: true
    args:
    # index 0 da execve é o caminho do binário que está sendo executado.
    - index: 0
      type: "string"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Postfix"        # casa o final do caminho (/usr/bin/curl -> "/curl")
        values:
        - "/curl"
        - "/wget"
        - "/apk"
        - "/apt-get"
        - "/nc"
      matchActions:
      - action: Post                # só observa. Troque por Sigkill/Override na contenção.
