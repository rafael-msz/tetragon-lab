apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "remocao-indicadores"
  annotations:
    mitre.technique: "T1070"
    description: "Remoção de rastros (.bash_history, /var/log)"
    modo-suportado: "observação"
spec:
  kprobes:
  - call: "sys_unlinkat"
    syscall: true
    args:
    - index: 0
      type: "int"
    - index: 1
      type: "string"
    selectors:
    - matchArgs:
      - index: 1
        operator: "Postfix"
        values:
        - ".bash_history"
    - matchArgs:
      - index: 1
        operator: "Prefix"
        values:
        - "/var/log"
