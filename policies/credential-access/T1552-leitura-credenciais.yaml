apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "leitura-credenciais"
spec:
  kprobes:
  - call: "security_file_open"
    syscall: false
    args:
    - index: 0
      type: "file"
    selectors:
    # cada condicao em um seletor separado = OU
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "/etc/shadow"
      matchActions:
      - action: Post
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/root/.ssh/"
      matchActions:
      - action: Post
