apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "persistencia-arquivos"
  annotations:
    mitre.technique: "T1098"
    description: "Escrita em arquivos de persistência (authorized_keys, cron, systemd)"
    modo-suportado: "observação"
spec:
  kprobes:
  - call: "security_file_open"
    syscall: false
    args:
    - index: 0
      type: "file"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "authorized_keys"
        - ".bashrc"
        - ".profile"
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/etc/cron"
        - "/var/spool/cron"
        - "/etc/systemd"
